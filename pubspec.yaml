name: flutter_msal_plus
description: Flutter integration with native Microsoft Authentication Library for interactive and silent authentication and account management.
version: 1.0.0
repository: https://github.com/wikilift/msal-flutter
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: org.wikilift.flutter_msal_plus
        pluginClass: FlutterMsalPlusPlugin
      ios:
        pluginClass: FlutterMsalPlusPlugin
